repos:
  - repo: local
    hooks:
      - id: zt-dsp-self-check
        name: ZT-DSP self-check (content gates; volatile counts skipped)
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/.." && ZT_SKIP_VOLATILE=1 bash scripts/self-check.sh'
        language: system
        pass_filenames: false
        always_run: true
